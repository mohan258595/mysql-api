<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f4f6f9;

            min-height: 100vh;

            padding: 40px 20px;

        }


        .container {

            max-width: 900px;

            margin: auto;

        }


        /* =============================
           HEADER
        ============================= */

        .header {

            background: white;

            padding: 25px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        .header h1 {

            margin-bottom: 8px;

        }


        .status {

            display: flex;

            align-items: center;

            gap: 8px;

            font-size: 14px;

            color: #666;

        }


        .status-dot {

            width: 10px;

            height: 10px;

            border-radius: 50%;

            background: green;

        }


        /* =============================
           FORM
        ============================= */

        .form-card {

            background: white;

            padding: 25px;

            border-radius: 12px;

            margin-bottom: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        .form-card h2 {

            margin-bottom: 20px;

        }


        .form {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

        }


        input {

            flex: 1;

            min-width: 180px;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

        }


        button {

            border: none;

            padding: 12px 20px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;

        }


        .add-btn {

            background: #2563eb;

            color: white;

        }


        .add-btn:hover {

            background: #1d4ed8;

        }


        /* =============================
           STUDENTS
        ============================= */

        .students-card {

            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.08);

        }


        .students-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .count {

            background: #e8f0ff;

            color: #2563eb;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 13px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding: 14px;

            text-align: left;

            border-bottom: 1px solid #eee;

        }


        th {

            background: #f8fafc;

        }


        .update-btn {

            background: #f59e0b;

            color: white;

            margin-right: 5px;

        }


        .update-btn:hover {

            background: #d97706;

        }


        .delete-btn {

            background: #ef4444;

            color: white;

        }


        .delete-btn:hover {

            background: #dc2626;

        }


        .empty {

            text-align: center;

            padding: 30px;

            color: #888;

        }


        /* =============================
           MESSAGE
        ============================= */

        .message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 8px;

            display: none;

        }


        .success {

            background: #dcfce7;

            color: #166534;

        }


        .error {

            background: #fee2e2;

            color: #991b1b;

        }


        /* =============================
           TERMINAL
        ============================= */

        .terminal-card {

            background: #111827;

            color: #e5e7eb;

            padding: 20px;

            border-radius: 12px;

            margin-top: 20px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.15);

        }


        .terminal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .terminal-title {

            color: #22c55e;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 16px;

            font-weight: bold;

        }


        .clear-btn {

            background: #374151;

            color: white;

            padding: 7px 12px;

            font-size: 12px;

        }


        .clear-btn:hover {

            background: #4b5563;

        }


        .terminal {

            background: #000;

            border-radius: 8px;

            padding: 15px;

            height: 280px;

            overflow-y: auto;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

        }


        .log {

            margin-bottom: 7px;

            line-height: 1.5;

            word-break: break-word;

        }


        .log-info {

            color: #60a5fa;

        }


        .log-success {

            color: #4ade80;

        }


        .log-error {

            color: #f87171;

        }


        .log-warning {

            color: #facc15;

        }


        .terminal-prompt {

            color: #22c55e;

        }


        /* =============================
           MOBILE
        ============================= */

        @media (max-width: 600px) {

            body {

                padding: 20px 10px;

            }


            .header,
            .form-card,
            .students-card,
            .terminal-card {

                padding: 18px;

            }


            table {

                font-size: 13px;

            }


            th,
            td {

                padding: 9px;

            }


            button {

                padding: 9px 12px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =============================
         HEADER
    ============================= -->

    <div class="header">

        <h1>
            Student Management
        </h1>


        <div class="status">

            <div
                id="statusDot"
                class="status-dot">
            </div>


            <span id="statusText">

                Connected to server

            </span>

        </div>

    </div>



    <!-- =============================
         ADD STUDENT
    ============================= -->

    <div class="form-card">

        <h2>
            Add Student
        </h2>


        <div class="form">

            <input
                type="number"
                id="studentId"
                placeholder="Student ID">


            <input
                type="text"
                id="studentName"
                placeholder="Student Name">


            <button
                class="add-btn"
                onclick="addStudent()">

                Add Student

            </button>

        </div>


        <div
            id="message"
            class="message">

        </div>

    </div>



    <!-- =============================
         STUDENTS
    ============================= -->

    <div class="students-card">


        <div class="students-header">

            <h2>
                Students
            </h2>


            <span
                id="studentCount"
                class="count">

                0 Students

            </span>

        </div>



        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>


                    <th>
                        Name
                    </th>


                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody
                id="studentTable">

            </tbody>

        </table>


        <div
            id="emptyMessage"
            class="empty">

            Loading students...

        </div>

    </div>



    <!-- =============================
         TERMINAL LOGS
    ============================= -->

    <div class="terminal-card">


        <div class="terminal-header">


            <div class="terminal-title">

                TERMINAL LOGS

            </div>


            <button
                class="clear-btn"
                onclick="clearLogs()">

                Clear

            </button>

        </div>



        <div
            id="terminal"
            class="terminal">

        </div>

    </div>


</div>



<script>


    // =============================
    // TERMINAL LOG SYSTEM
    // =============================


    function getTime() {

        const now =
            new Date();


        return now.toLocaleTimeString();

    }



    function addLog(
        message,
        type = "info"
    ) {


        const terminal =
            document.getElementById(
                "terminal"
            );


        const log =
            document.createElement(
                "div"
            );


        log.className =
            `log log-${type}`;


        log.innerHTML =

            `<span class="terminal-prompt">&gt;</span> ` +

            `[${getTime()}] ` +

            message;


        terminal.appendChild(log);


        terminal.scrollTop =
            terminal.scrollHeight;

    }



    function clearLogs() {


        document.getElementById(
            "terminal"
        ).innerHTML = "";


        addLog(
            "Terminal cleared",
            "info"
        );

    }



    // =============================
    // PAGE LOAD
    // =============================


    document.addEventListener(
        "DOMContentLoaded",
        () => {

            addLog(
                "Student Management started",
                "success"
            );


            addLog(
                "GET /students",
                "info"
            );


            loadStudents();

        }
    );



    // =============================
    // READ STUDENTS
    // =============================


    async function loadStudents() {


        try {


            const response =
                await fetch(
                    "/students"
                );


            const students =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    students.error ||
                    "Failed to load students"
                );

            }


            displayStudents(
                students
            );


            addLog(
                `READ SUCCESS - ${students.length} students loaded`,
                "success"
            );


        }
        catch (error) {


            console.error(
                error
            );


            addLog(
                `READ FAILED - ${error.message}`,
                "error"
            );


            showMessage(
                error.message,
                "error"
            );

        }

    }



    // =============================
    // DISPLAY STUDENTS
    // =============================


    function displayStudents(
        students
    ) {


        const table =
            document.getElementById(
                "studentTable"
            );


        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );


        const count =
            document.getElementById(
                "studentCount"
            );


        table.innerHTML =
            "";


        count.textContent =

            `${students.length} Student` +

            `${students.length !== 1 ? "s" : ""}`;



        if (
            students.length === 0
        ) {


            emptyMessage.style.display =
                "block";


            emptyMessage.textContent =
                "No students found";


            return;

        }



        emptyMessage.style.display =
            "none";



        students.forEach(
            student => {


                const row =
                    document.createElement(
                        "tr"
                    );


                const safeName =
                    String(student.name)
                        .replace(
                            /'/g,
                            "\\'"
                        );


                row.innerHTML = `

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>

                        <button
                            class="update-btn"
                            onclick="updateStudent(${student.id}, '${safeName}')">

                            Update

                        </button>


                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${student.id})">

                            Delete

                        </button>

                    </td>

                `;


                table.appendChild(
                    row
                );

            }
        );

    }



    // =============================
    // CREATE STUDENT
    // =============================


    async function addStudent() {


        const id =
            document.getElementById(
                "studentId"
            ).value;


        const name =
            document.getElementById(
                "studentName"
            ).value.trim();



        if (!id || !name) {


            addLog(
                "CREATE FAILED - ID and name are required",
                "error"
            );


            showMessage(
                "Please enter ID and name",
                "error"
            );


            return;

        }



        addLog(
            `POST /students`,
            "info"
        );


        addLog(
            `CREATE - ID: ${id}, Name: ${name}`,
            "info"
        );



        try {


            const response =
                await fetch(
                    "/students",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                id:
                                    Number(id),

                                name:
                                    name

                            })

                    }
                );



            const data =
                await response.json();



            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to add student"
                );

            }



            document.getElementById(
                "studentId"
            ).value =
                "";


            document.getElementById(
                "studentName"
            ).value =
                "";



            addLog(
                `CREATE SUCCESS - Student ${id} created`,
                "success"
            );


            showMessage(
                "Student added successfully",
                "success"
            );


            loadStudents();

        }
        catch (error) {


            addLog(
                `CREATE FAILED - ${error.message}`,
                "error"
            );


            showMessage(
                error.message,
                "error"
            );

        }

    }



    // =============================
    // UPDATE STUDENT
    // =============================


    async function updateStudent(
        id,
        oldName
    ) {


        const newName =
            prompt(
                "Enter new student name:",
                oldName
            );


        if (
            newName === null
        ) {

            addLog(
                `UPDATE CANCELLED - Student ${id}`,
                "warning"
            );

            return;

        }



        const name =
            newName.trim();



        if (!name) {


            addLog(
                `UPDATE FAILED - Empty name for student ${id}`,
                "error"
            );


            showMessage(
                "Name cannot be empty",
                "error"
            );


            return;

        }



        addLog(
            `PUT /students/${id}`,
            "info"
        );


        addLog(
            `UPDATE - ID: ${id}, New Name: ${name}`,
            "info"
        );



        try {


            const response =
                await fetch(
                    `/students/${id}`,
                    {

                        method: "PUT",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                name:
                                    name

                            })

                    }
                );



            const data =
                await response.json();



            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Update failed"
                );

            }



            addLog(
                `UPDATE SUCCESS - Student ${id} updated`,
                "success"
            );


            showMessage(
                "Student updated successfully",
                "success"
            );


            loadStudents();

        }
        catch (error) {


            addLog(
                `UPDATE FAILED - ${error.message}`,
                "error"
            );


            showMessage(
                error.message,
                "error"
            );

        }

    }



    // =============================
    // DELETE STUDENT
    // =============================


    async function deleteStudent(
        id
    ) {


        if (
            !confirm(
                "Are you sure you want to delete this student?"
            )
        ) {


            addLog(
                `DELETE CANCELLED - Student ${id}`,
                "warning"
            );


            return;

        }



        addLog(
            `DELETE /students/${id}`,
            "info"
        );


        addLog(
            `DELETE - Student ID: ${id}`,
            "info"
        );



        try {


            const response =
                await fetch(
                    `/students/${id}`,
                    {

                        method:
                            "DELETE"

                    }
                );



            const data =
                await response.json();



            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Delete failed"
                );

            }



            addLog(
                `DELETE SUCCESS - Student ${id} deleted`,
                "success"
            );


            showMessage(
                "Student deleted successfully",
                "success"
            );


            loadStudents();

        }
        catch (error) {


            addLog(
                `DELETE FAILED - ${error.message}`,
                "error"
            );


            showMessage(
                error.message,
                "error"
            );

        }

    }



    // =============================
    // MESSAGE
    // =============================


    function showMessage(
        text,
        type
    ) {


        const message =
            document.getElementById(
                "message"
            );


        message.textContent =
            text;


        message.className =
            `message ${type}`;


        message.style.display =
            "block";



        setTimeout(
            () => {

                message.style.display =
                    "none";

            },
            3000
        );

    }

</script>


</body>

</html>
